<div class="card">
    <div class="card-header">
        <h2 class="m-0"><strong>{{isineditmode?'UPDATE STD':'ADD STD'}}</strong></h2>
    </div>
    <div class="card-body">
        <form #movieform="ngForm" (ngSubmit)="onAddMovie()">
            <div class="form-group">
                <label for="title">TITLE :-</label>
                <input
                required
                ngModel 
                name="title"
                type="text" class="form-control">
            </div>

            <div class="form-group">
                <label for="overview">CONTENT :-</label>
                <textarea 
                required
                ngModel 
                name="overview"
                class="form-control" rows="4"></textarea>
            </div>

            <div class="form-group">
                <label for="vote_average">RATING :-</label>
                <input 
                required
                ngModel 
                name="vote_average"
                type="number" class="form-control">
            </div>

             <div class="form-group">
                <label for="poster_path">IMAGE URL :-</label>
                <input 
                required
                ngModel 
                name="poster_path"
                type="text" class="form-control">
            </div>

            <div>
                <button 
                *ngIf="!isineditmode"
                mat-raised-button color="primary" class="btn-block">ADD MOVIE</button>

                <button 
                *ngIf="isineditmode"
                (click)="onupdate()"
                mat-raised-button type="button" color="accent" class="btn-block">UPDATE MOVIE</button>
            </div>
        </form>
    </div>
</div>
