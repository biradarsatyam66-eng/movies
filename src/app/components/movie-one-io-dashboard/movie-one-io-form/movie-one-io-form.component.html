<div class="card mt-3">
    <div class="card-header">
        <h2 class="m-0"><strong>{{isineditmode?'UPDATE MOVIE':'ADD MOVIE'}}</strong></h2>
    </div>
    <div class="card-body">
        <form #movieform="ngForm" (ngSubmit)="onAddMovie()">
            <div class="form-group">
                <label for="title">TITLE :-</label>
                <input 
                required
                ngModel
                name="title"
                type="text" class="form-control">
            </div>

            <div class="form-group">
                <label for="overview">CONTENT :-</label>
                <textarea 
                required
                ngModel
                name="overview"
                rows="4"
                class="form-control"></textarea>
            </div>

            <div class="form-group">
                <label for="vote_average">RATING :-</label>
                <input 
                required
                ngModel
                name="vote_average"
                type="number" class="form-control">
            </div>

            <div class="form-group">
                <label for="poster_path">IMAGE URL :-</label>
                <input 
                required
                ngModel
                name="poster_path"
                type="text" class="form-control">
            </div>
            <p *ngIf="isInvalid && movieform.invalid">
                <strong class="text-danger">PLEASE ENTER ALL THE DETAILS !!</strong>
            </p>

            <div>
                <button 
                *ngIf="!isineditmode"
                mat-raised-button color="primary" class="btn-block">ADD MOVIE</button>

                <button 
                *ngIf="isineditmode"
                (click)="onUpdate()"
                mat-raised-button color="accent" class="btn-block">UPDATE MOVIE</button>
            </div>
        </form>
    </div>
</div>
